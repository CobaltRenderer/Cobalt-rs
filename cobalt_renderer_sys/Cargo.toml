[package]
name = "cobalt_renderer_sys"
version = "2.0.0"
edition = "2024"
rust-version = "1.88.0"
description = "FFI bindings for the Cobalt Renderer"
repository = "https://github.com/CobaltRenderer/Cobalt-rs"
homepage = "https://github.com/CobaltRenderer/Cobalt-rs"
links = "cobaltrenderer"
readme = "README.md"
license = "MIT"
exclude = [
    "generate_bindings.sh"
]

[features]
default = []
download_sdk = ["dep:ureq", "dep:sha2", "dep:zip"]
build_sdk = ["dep:git2"]
generate_bindings = ["dep:bindgen"]

[build-dependencies]
bindgen = { version = "0.72.1", optional=true }
ureq = { version = "3.1.4", optional=true, default-features=false, features=["rustls"] }
sha2 = { version = "0.11.0", optional=true, default-features=false }
zip = { version = "8.6.0", optional=true, default-features=false, features=["deflate"] }
git2 = { version = "0.21.0", optional=true, default-features = false, features=["https"]}
